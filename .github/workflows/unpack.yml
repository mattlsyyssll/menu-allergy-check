# One-time workflow: joins the uploaded ZIP parts, checks the SHA-256, unpacks into the repo root and commits as github-actions[bot]. Delete this file after the run.
name: unpack
on:
  push:
    paths:
      - "repo.zip.part-*"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the parts and check the ZIP hash
        run: |
          test "$(ls repo.zip.part-* | wc -l)" -eq 4
          cat repo.zip.part-* > repo.zip
          echo "700dfcfce284b7cecb3f23647d352cd9f14a2fc7fa098e4f63e3e941c21cbf37  repo.zip" | sha256sum -c -
      - name: Unpack
        run: |
          unzip -q repo.zip -d .
          rm repo.zip repo.zip.part-*
          echo "files after unpack: $(git ls-files -o --exclude-standard | wc -l) new, $(git ls-files -d | wc -l) removed"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack repo"
          git push
