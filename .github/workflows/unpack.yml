# One-time workflow: joins the uploaded update ZIP parts, checks the SHA-256, unpacks over the repo (new and changed files only) and commits as github-actions[bot]. Delete this file after the run.
name: unpack
on:
  push:
    paths:
      - "update.zip.part-*"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the parts and check the ZIP hash
        run: |
          test "$(ls update.zip.part-* | wc -l)" -eq 6
          cat update.zip.part-* > update.zip
          echo "186e25c57ab9184a2819a0ce5b09b31b0dd9a228a985689f552277eff3c2f2f4  update.zip" | sha256sum -c -
      - name: Unpack
        run: |
          unzip -o -q update.zip -d .
          rm update.zip update.zip.part-*
          echo "changed files: $(git status --porcelain | wc -l)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update: held-out sets 3 to 5, rounds 6 to 8"
          git push
