# Checks for the menu allergy check repository. Every command exits 0 on pass and non-zero on failure. Permissions are read-only.
# Kit checks run with no model and no network. The app job uses the lockfile (npm ci).
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Kit checks (held-out set 1 and the shared library)
        run: |
          set -e
          python3 -I tests/run_tests.py
          python3 -I scripts/testkit/score.py --selftest
          python3 -I scripts/testkit/replay.py --selftest
          python3 -I scripts/testkit/cases.py --selftest
          python3 -I scripts/testkit/keys.py --selftest
          python3 -I scripts/testkit/freeze.py --selftest
          python3 -I scripts/testkit/runs.py --selftest
          python3 -I scripts/testkit/trace.py --selftest
          python3 -I scripts/testkit/keys.py verify kit.json
          python3 -I scripts/testkit/freeze.py check kit.json
          python3 -I scripts/testkit/cases.py check kit.json
          python3 -I scripts/testkit/trace.py kit.json
          python3 -I scripts-v2/test_privacy_v2.py
      - name: Kit checks (held-out set 2)
        working-directory: kit/heldout-set-2
        run: |
          set -e
          python3 -I ../scripts/testkit/keys.py verify kit.json
          python3 -I ../scripts/testkit/freeze.py check kit.json
          python3 -I ../scripts/testkit/cases.py check kit.json
          python3 -I ../scripts/testkit/trace.py kit.json
      - name: Re-score equals the saved scores
        run: |
          set -e
          python3 -I scripts/metrics.py kit.json --out /tmp/metrics-set1.md
          diff /tmp/metrics-set1.md scores/METRICS.md
          python3 -I scripts-v2/metrics_v2.py kit.json --out /tmp/metrics-v2-set1.md
          diff /tmp/metrics-v2-set1.md scripts-v2/METRICS-v2-set1.md
          cd heldout-set-2
          python3 -I ../scripts/metrics.py kit.json --out /tmp/metrics-set2.md
          diff /tmp/metrics-set2.md scores/METRICS.md
          python3 -I ../scripts-v2/metrics_v2.py kit.json --out /tmp/metrics-v2-set2.md
          diff /tmp/metrics-v2-set2.md ../scripts-v2/METRICS-v2.md
      - name: Saved files unchanged by the re-run
        working-directory: .
        run: git diff --exit-code && echo "re-run files equal the saved ones"
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: node --version
      - run: npm ci
      - run: npm test
      - run: npm run build
